name: Publish desktop and Android releases

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and package Windows app
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $env:FIELDNOTES_SKIP_SHORTCUT = '1'
          .\build-app.ps1
          $stage = Join-Path $env:RUNNER_TEMP 'Fieldnotes'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($item in @('Fieldnotes.exe', 'index.html', 'styles.css', 'app.js', 'COLLEGE_ROADMAP.md', 'README.md', 'SECURITY.md', 'build-app.ps1', 'desktop-app', 'lessons', 'examples')) {
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE $item) -Destination $stage -Recurse -Force
          }
          $zip = Join-Path $env:RUNNER_TEMP 'Fieldnotes-Windows.zip'
          Add-Type -AssemblyName System.IO.Compression
          $zipStream = [IO.File]::Open($zip, [IO.FileMode]::Create, [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
          $archive = [IO.Compression.ZipArchive]::new($zipStream, [IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in Get-ChildItem -Path $stage -File -Recurse) {
              $relative = $file.FullName.Substring($stage.TrimEnd('\').Length + 1).Replace('\', '/')
              $entry = $archive.CreateEntry($relative, [IO.Compression.CompressionLevel]::Optimal)
              $sourceStream = $file.OpenRead()
              $targetStream = $entry.Open()
              try {
                $sourceStream.CopyTo($targetStream)
              } finally {
                $targetStream.Dispose()
                $sourceStream.Dispose()
              }
            }
          } finally {
            $archive.Dispose()
            $zipStream.Dispose()
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Fieldnotes-Windows.zip" | Set-Content -Encoding ascii "$zip.sha256"
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          "RELEASE_HASH=$zip.sha256" >> $env:GITHUB_ENV
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notesFile = Join-Path $env:GITHUB_WORKSPACE "release-notes\$tag.md"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            if (Test-Path -LiteralPath $notesFile) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Fieldnotes $tag" --notes-file $notesFile
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not update the GitHub release notes.'
              }
            }
            gh release upload $tag $env:RELEASE_ZIP $env:RELEASE_HASH --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            if (Test-Path -LiteralPath $notesFile) {
              gh release create $tag $env:RELEASE_ZIP $env:RELEASE_HASH --repo $env:GITHUB_REPOSITORY --title "Fieldnotes $tag" --notes-file $notesFile
            } else {
              gh release create $tag $env:RELEASE_ZIP $env:RELEASE_HASH --repo $env:GITHUB_REPOSITORY --title "Fieldnotes $tag" --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not publish the Windows release assets.'
          }

  android:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: ''
      - name: Prepare Android signing
        id: android_signing
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Android release skipped because $name is not configured. See README.md to enable signed APK releases."
              exit 0
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          test -s android/app/release-key.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-key.jks" >> "$GITHUB_ENV"
      - name: Build signed Android APK and App Bundle
        if: steps.android_signing.outputs.enabled == 'true'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          bundle_verification="$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1)"
          printf '%s\n' "$bundle_verification"
          if ! printf '%s\n' "$bundle_verification" | grep -q 'jar verified'; then
            echo 'The Android App Bundle is not signed.'
            exit 1
          fi
          cd ..
          python scripts/verify_android_apk.py android/app/build/outputs/apk/release/app-release.apk
          python scripts/verify_android_apk.py android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/app-release.apk.sha256
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Upload APK to the GitHub release
        if: steps.android_signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release.apk.sha256 \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/bundle/release/app-release.aab.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
